[package]
name = "share"
version = "1.0.2"
edition = "2021"
description = "CLI for Share Anything file sharing"
license = "MIT"

[[bin]]
name = "share"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["multipart", "stream", "json", "rustls-tls", "http2"] }
tokio = { version = "1", features = ["full"] }
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
anyhow = "1"
atty = "0.2"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
mime_guess = "2"
qrcode = "0.14"
open = "5"
os_info = "3.14.0"
chrono = "0.4.44"
iana-time-zone = "0.1.65"
unicode-width = "0.1"
webrtc = "0.11"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
bytes = "1"
thiserror = "1"
ratatui = "0.28"
crossterm = "0.28"
tui-textarea = "0.6"
arboard = { version = "3", optional = true, default-features = false }

[features]
default = ["clipboard"]
clipboard = ["dep:arboard"]
